apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-management
  namespace: tramitacion
spec:
  replicas: 2
  selector:
    matchLabels: {app: case-management}
  template:
    metadata:
      labels:
        app: case-management
    spec:
      containers:
        - name: app
          image: registry.interno.example:5000/tramitacion/case-web:1.4.2
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: case-db, key: password}
          securityContext:
            privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: case-management
  namespace: tramitacion
spec:
  selector:
    app: case-management
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: case-management
  namespace: tramitacion
spec:
  rules:
    - host: expedientes.interno.example
      http:
        paths:
          - path: /cases
            pathType: Prefix
            backend:
              service:
                name: case-management
                port: {number: 80}
---
apiVersion: v1
kind: Secret
metadata:
  name: case-db
type: Opaque
data:
  password: c2VjcmV0
