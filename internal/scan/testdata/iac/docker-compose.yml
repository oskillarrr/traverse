services:
  notifications:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/CASES
      SPRING_ARTEMIS_BROKER_URL: tcp://broker:61616
    depends_on: [oracle, broker]
  oracle:
    image: gvenzl/oracle-xe:21-slim
  broker:
    image: apache/activemq-artemis:latest
